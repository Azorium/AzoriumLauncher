name: Wails Build

on:
  push:
    tags:
      - '*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'my-wails-app'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
            artifact_name: 'my-wails-app-linux-amd64'   # новое поле
#          - name: 'my-wails-app'
#            platform: 'windows/amd64'
#            os: 'windows-latest'
#            artifact_name: 'my-wails-app-windows-amd64'
          - name: 'my-wails-app'
            platform: 'darwin/universal'
            os: 'macos-latest'
            artifact_name: 'my-wails-app-macos-universal'

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc

      - name: Build application
        run: wails build -platform ${{ matrix.build.platform }} -clean -debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.artifact_name }}   # используем безопасное имя
          path: build/bin/*